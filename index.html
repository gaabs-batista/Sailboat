<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oceanic Sails</title>

  <link rel="stylesheet" href="style.css" />

  <!-- Fonte -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">
      <span>⚓</span>
      Oceanic Sails
    </div>

    <nav>
      <a href="#">Home</a>
      <a href="#">Tipos</a>
      <a href="#">História</a>
      <a href="#">Explorar</a>
      <a href="#">Contato</a>
    </nav>

    <button class="nav-btn">Descobrir</button>
  </header>

  <!-- HERO -->
  <section class="hero">

    <!-- overlay -->
    <div class="overlay"></div>

    <!-- conteúdo -->
    <div class="hero-content">

      <span class="mini-title">Seu guia no oceano</span>

      <h1>
        Perdido no Mar,<br>
        Encontrado na Liberdade
      </h1>

      <p>
        Descubra os diferentes tipos de veleiros, histórias marítimas,
        tecnologias náuticas e curiosidades do mundo da navegação.
      </p>

      <div class="buttons">
        <button class="primary-btn">Explorar Veleiros</button>
        <button class="secondary-btn">Ler Artigos</button>
      </div>

      <div class="scroll-indicator">
        <span>SCROLL</span>
        <div class="line"></div>
      </div>

    </div>

  </section>

  <script src="script.js"></script>
</body>
</html>
